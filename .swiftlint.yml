# SwiftLint configuration
# Inherits from the shared parent configuration in swift-standards

parent_config: https://raw.githubusercontent.com/swift-primitives/.github/main/.swiftlint.yml

# Package-specific overrides
disabled_rules:
  - function_parameter_count
  # Binary.Machine.Run.swift's interpreter uses `try! input.advance()` at ~40
  # sites, each in the `else` branch of a preceding `remaining < need` bounds
  # check, so every force-try is provably in-bounds. The force-try is a
  # deliberate fast-path choice; disable the rule package-wide (all force-trys
  # live in that one deliberate interpreter). Mirrors the swift-format
  # `NeverUseForceTry` file-ignore in that file.
  - force_try
